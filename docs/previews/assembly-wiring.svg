<svg xmlns="http://www.w3.org/2000/svg" width="940" height="550" viewBox="0 0 940 550" role="img" aria-labelledby="title desc"><title id="title">Peltier driver wiring, component-side view</title><desc id="desc">USB ports at left. On the right from top to bottom are TEC, HOT and COLD. TEC lower terminal is positive. Both sensor ports read ground, data, 3.3 volts from top to bottom.</desc><style>text{font-family:system-ui,sans-serif;fill:#14242d;dominant-baseline:middle}.heading{font-size:28px;font-weight:700}.detail{font-size:14px;fill:#526570}.port{font-size:16px;font-weight:700}.wire{font-size:15px}.terminal{fill:#e6edf0;stroke:#4a6573;stroke-width:1.5}.board{fill:#deebe7;stroke:#39615c;stroke-width:2}</style><rect width="940" height="550" fill="#f8faf9"/><text class="heading" x="37" y="39">Peltier driver wiring</text><text class="detail" x="37" y="68">Component side · orient the two USB-C ports to your left</text><rect class="board" x="267" y="92" width="395.125" height="321.55" rx="4"/><text class="detail" x="431" y="247" text-anchor="middle">72.5 × 59 mm PCB</text><path d="M215 192.825 H270" stroke="#526e81" stroke-width="3"/><rect class="terminal" x="262" y="171.825" width="45" height="42" rx="5"/><text class="port" x="193" y="183.825" text-anchor="end">J_USB · PD IN</text><text class="detail" x="193" y="206.825" text-anchor="end">20 V / 5 A USB-C PD</text><path d="M215 359.05 H270" stroke="#526e81" stroke-width="3"/><rect class="terminal" x="262" y="338.05" width="45" height="42" rx="5"/><text class="port" x="193" y="350.05" text-anchor="end">J_PROGRAM</text><text class="detail" x="193" y="373.05" text-anchor="end">USB data to computer</text><g><rect class="terminal" x="626" y="100.72000000000001" width="38" height="48" rx="3"/><text class="port" x="610" y="124.7" text-anchor="end">J_TEC</text><path d="M644 138.32497275 H705" stroke="#d63832" stroke-width="3"/><circle cx="644" cy="138.32497275" r="4.5" fill="#d63832" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="138.32497275">1 · Red · TEC+</text><path d="M644 111.07502725 H705" stroke="#1d2937" stroke-width="3"/><circle cx="644" cy="111.07502725" r="4.5" fill="#1d2937" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="111.07502725">2 · Black · GND</text></g><g><rect class="terminal" x="626" y="162.305" width="38" height="55.6" rx="3"/><text class="port" x="610" y="190.10000000000002" text-anchor="end">J_HOT_SENSOR</text><path d="M644 209.17496185 H705" stroke="#d63832" stroke-width="3"/><circle cx="644" cy="209.17496185" r="4.5" fill="#d63832" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="209.17496185">1 · Red · 3.3 V</text><path d="M644 190.10000000000002 H705" stroke="#bd8700" stroke-width="3"/><circle cx="644" cy="190.10000000000002" r="4.5" fill="#bd8700" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="190.10000000000002">2 · Yellow · DATA</text><path d="M644 171.02503815 H705" stroke="#1d2937" stroke-width="3"/><circle cx="644" cy="171.02503815" r="4.5" fill="#1d2937" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="171.02503815">3 · Black · GND</text></g><g><rect class="terminal" x="626" y="265.855" width="38" height="55.6" rx="3"/><text class="port" x="610" y="293.65" text-anchor="end">J_COLD_SENSOR</text><path d="M644 312.72496185 H705" stroke="#d63832" stroke-width="3"/><circle cx="644" cy="312.72496185" r="4.5" fill="#d63832" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="312.72496185">1 · Red · 3.3 V</text><path d="M644 293.65 H705" stroke="#bd8700" stroke-width="3"/><circle cx="644" cy="293.65" r="4.5" fill="#bd8700" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="293.65">2 · Yellow · DATA</text><path d="M644 274.57503814999995 H705" stroke="#1d2937" stroke-width="3"/><circle cx="644" cy="274.57503814999995" r="4.5" fill="#1d2937" stroke="white" stroke-width="1.5"/><text class="wire" x="717" y="274.57503814999995">3 · Black · GND</text></g><rect class="terminal" x="602" y="377" width="58" height="23" rx="3"/><text class="port" x="583" y="388" text-anchor="end">J_FAN</text><text class="wire" x="610" y="389">1 2 3 4</text><text class="port" x="267" y="454">J_FAN · keyed factory plug</text><text class="detail" x="267" y="483">Left to right · 1 black GND · 2 yellow +12 V · 3 green tach NC · 4 blue PWM NC</text><text class="detail" x="267" y="513">DFRobot DFR0198 probe colors shown. HOT is GP8 and COLD is GP9.</text></svg>
